name: 故障报告
description: 使用自建材料报告可复现故障
body:
  - type: markdown
    attributes:
      value: 不上传密钥、个人文档、完整日志或 .env。安全漏洞请按 SECURITY.md 私下联系维护者。
  - type: input
    id: version
    attributes:
      label: 版本与平台
      placeholder: 0.7.10 / Windows / Python / 标准启动入口
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为、源文件是否变化、是否有副本
  - type: textarea
    id: evidence
    attributes:
      label: 自建最小样例与脱敏错误阶段
